    <main>

<section class="contact-page">


    <div class="container">

        <div class="text-center mb-5">

            <p class="contact-label">
                CONTACT
            </p>

            <h1>
                Let's Connect
            </h1>

            <p class="contact-intro">
                Every pregnacny journey deserves extra support. I would love to be apart of yours! Let's connect!
            </p>


        </div>


        <div class="contact-form">

            <form action="#" method="POST">

                <div class="mb-3">

                    <label for-="name" class="form-label">
                        Full Name
                    </label>

                    <input type="text" class="form-control" id="name" name="name" required>

                </div>


                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input type="email" class="form-control" id="email" name="email" required>

                </div>

                <div class="mb-3">

                    <label for="phone" class="form-label">
                        Phone Number
                    </label>

                    <input type="tel" class="form-control" id="phone" name="phone">
                    
                    <div class="mb-3">

                        <label for="due date" class="form-label">
                            Expected Due Date
                        </label>

                        <input type="date" class="form-control" id="due-date" name="due-date">
                    <div class="mb-3">

                        <label for="message" class="form-label">
                            How Can I Help?
                        </label>

                        <textarea class="form-control" id="message" name="message" rows="5" required>

                        </textarea>
                    </div>

                    <div class="text-center">

                        <button type="submit" class="hero-button">
                            Send Message
                        </button>
                    </div>
                
                    </div>
                </div>

            </form>

        </div>

    </div>





</section>
